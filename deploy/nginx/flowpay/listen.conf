# Plain HTTP inside the container. To terminate TLS here (and send HSTS), mount a
# replacement, for example:
#   listen 8443 ssl;
#   ssl_certificate /run/secrets/edge-cert.pem;
#   ssl_certificate_key /run/secrets/edge-key.pem;
#   ssl_protocols TLSv1.2 TLSv1.3;
# Production refresh cookies are Secure: browsers only keep them over HTTPS
# (or on http://localhost).
listen 8080;
