# Headers on everything the dashboard serves itself (API responses keep the backend's).
# Included in each static location: a location with its own add_header inherits none.
#
# script-src: the bundle, plus the inline theme script in index.html by hash
#   (src/app/index-html.test.ts fails when the two drift apart).
# style-src 'unsafe-inline': React, Radix and Motion set style attributes (sizes,
#   positions, progress widths), and the toast library injects its stylesheet.
# No 'unsafe-eval': schemas run zod in jitless mode (src/lib/zod.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-bo02NfIIKxDEztdjn3aGVbgPzxt4gjWs0fxM2ccGjp8='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Dashboard URLs carry record IDs (?delivery=, ?refund=); links out must not leak them.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $flowpay_hsts always;
add_header X-Request-Id $request_id always;
