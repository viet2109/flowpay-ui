# FlowPay dashboard edge. Browsers see a single origin: this server returns the built
# dashboard and proxies /api/v1/ to the backend. That keeps the backend's same-origin
# auth model (host-only refresh cookie, CORS closed, X-FlowPay-CSRF marker) unchanged.
# The API routes, rate limits and forwarded-header handling copy the backend's
# reviewed edge policy (backend ops/ingress). Change both together.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    send_timeout 30s;

    # The build is mostly text: about 590 kB of JavaScript, 195 kB once gzipped.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    map $request_method $auth_ip {
        default "";
        POST $binary_remote_addr;
    }
    map $request_method $mutation_ip {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }
    # Finite per-edge shared memory; never trust incoming real-IP/forwarded fields.
    # The key is the TCP peer, so this server must be the edge clients connect to.
    limit_req_zone $auth_ip zone=flowpay_auth:10m rate=10r/m;
    limit_req_zone $mutation_ip zone=flowpay_mutations:10m rate=10r/s;
    limit_req_status 429;

    # HSTS only when this server terminates TLS (see listen.conf); empty omits it.
    map $https $flowpay_hsts {
        on "max-age=86400";
        default "";
    }

    # The upstream (FLOWPAY_API_UPSTREAM) is filled in at container start.
    include /etc/nginx/conf.d/*.conf;
}
